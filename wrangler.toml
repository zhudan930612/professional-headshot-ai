# Cloudflare Pages 配置
name = "professional-headshot-ai"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

# Pages 项目配置
pages_build_output_dir = "dist"

[vars]
NODE_VERSION = "22"
PNPM_VERSION = "10.26.1"
GOOGLE_CLIENT_ID = "755491832026-8i70ngrnddnfh6dnsupuokoltcckg650.apps.googleusercontent.com"
ALLOW_NEW_ACCOUNTS = "true"
APP_URL = "https://www.professionalheadshotai.ink"
CREEM_TEST_MODE = "false"
CREEM_PROFESSIONAL_PRODUCT_ID = "prod_3VuEcSLV7nUFQIFYByNkaG"
CREEM_EXECUTIVE_PRODUCT_ID = "prod_3goNXcJoP80L3mmWoAdkZs"
NANO_BANANA_MODEL_1K = "nano-banana-2-lite"
NANO_BANANA_MODEL_2K = "gemini-3.1-flash-image-preview"

[[d1_databases]]
binding = "DB"
database_name = "professional-headshot-ai"
database_id = "a3c45b09-7544-4a08-8ec8-7d7b998ba8da"
migrations_dir = "database/d1"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "professional-headshot-ai"

